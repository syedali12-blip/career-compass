<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1B2440"/>
      <stop offset="100%" stop-color="#101627"/>
    </radialGradient>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4C77A"/>
      <stop offset="100%" stop-color="#B4903B"/>
    </linearGradient>
  </defs>

  <circle cx="300" cy="300" r="290" fill="url(#bg)" stroke="#3A4568" stroke-width="2"/>

  <!-- outer tick ring -->
  <g stroke="#5A6688" stroke-width="1.5">
    <circle cx="300" cy="300" r="245" fill="none"/>
  </g>
  <g id="ticks" stroke="#8E97A8" stroke-width="2">
    <!-- 24 ticks -->
    <g id="tick-group"></g>
  </g>

  <!-- Generate 24 ticks manually -->
  <g stroke="#6B7591" stroke-width="1.5">
    <line x1="300" y1="55"  x2="300" y2="75"/>
    <line x1="300" y1="525" x2="300" y2="545"/>
    <line x1="55"  y1="300" x2="75"  y2="300"/>
    <line x1="525" y1="300" x2="545" y2="300"/>
  </g>

  <!-- Cardinal letters -->
  <text x="300" y="45" text-anchor="middle" fill="#8E97A8" font-family="Georgia, serif" font-size="20" letter-spacing="2">N</text>
  <text x="300" y="568" text-anchor="middle" fill="#8E97A8" font-family="Georgia, serif" font-size="20" letter-spacing="2">S</text>
  <text x="45" y="308" text-anchor="middle" fill="#8E97A8" font-family="Georgia, serif" font-size="20" letter-spacing="2">W</text>
  <text x="558" y="308" text-anchor="middle" fill="#8E97A8" font-family="Georgia, serif" font-size="20" letter-spacing="2">E</text>

  <!-- Compass needle / C shape combined -->
  <!-- Long brass needle pointing NE (toward "path found") -->
  <g transform="rotate(-35 300 300)">
    <polygon points="300,150 316,300 300,310 284,300" fill="url(#brass)"/>
    <polygon points="300,450 316,300 300,290 284,300" fill="#4A5578"/>
  </g>

  <!-- Center hub -->
  <circle cx="300" cy="300" r="14" fill="#0F1424" stroke="url(#brass)" stroke-width="3"/>

  <!-- Negative-space "C" formed by the inner ring gap, standing for Compass/Career -->
  <path d="M 300 190 A 110 110 0 1 0 380 230" fill="none" stroke="url(#brass)" stroke-width="6" stroke-linecap="round" opacity="0.85"/>

  <!-- Wordmark -->
  <text x="300" y="470" text-anchor="middle" fill="#F2EFE7" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold" letter-spacing="1">Career Compass</text>
  <text x="300" y="500" text-anchor="middle" fill="#8E97A8" font-family="Arial, sans-serif" font-size="14" letter-spacing="4">FIND YOUR BEARING</text>
</svg>
