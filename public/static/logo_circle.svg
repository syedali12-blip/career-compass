<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8AE"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="goldFacet2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B4903B"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <filter id="goldGlowSharp" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Hexagonal facet frame instead of a plain circle -->
  <polygon points="100,8 176,52 176,148 100,192 24,148 24,52"
           fill="url(#navyBg)" stroke="#D4AF37" stroke-width="2.5" filter="url(#goldGlowSharp)"/>
  <polygon points="100,24 162,60 162,140 100,176 38,140 38,60"
           fill="none" stroke="#D4AF37" stroke-width="0.75" opacity="0.5"/>

  <!-- Angular faceted compass star (diamond-style points, not soft needle) -->
  <g transform="rotate(0 100 100)">
    <polygon points="100,38 112,100 100,100 88,100" fill="url(#goldFacet1)"/>
    <polygon points="100,38 88,100 100,100 100,100" fill="url(#goldFacet2)" opacity="0.85"/>
    <polygon points="100,162 112,100 100,100 88,100" fill="#3A4568"/>
    <polygon points="162,100 100,112 100,100 100,88" fill="url(#goldFacet1)" opacity="0.75"/>
    <polygon points="38,100 100,112 100,100 100,88" fill="#3A4568" opacity="0.9"/>
  </g>

  <!-- Sharp diagonal facets -->
  <g opacity="0.6" stroke="#D4AF37" stroke-width="0.75">
    <line x1="100" y1="100" x2="140" y2="60"/>
    <line x1="100" y1="100" x2="60" y2="140"/>
    <line x1="100" y1="100" x2="60" y2="60"/>
    <line x1="100" y1="100" x2="140" y2="140"/>
  </g>

  <!-- Center faceted hub (hexagon, not circle) -->
  <polygon points="100,88 110,94 110,106 100,112 90,106 90,94"
           fill="#0B132B" stroke="url(#goldFacet1)" stroke-width="2" filter="url(#goldGlowSharp)"/>
  <circle cx="100" cy="100" r="2.5" fill="#FFE8AE"/>
</svg>
